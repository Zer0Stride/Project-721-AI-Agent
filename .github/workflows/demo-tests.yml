name: Demo en tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline unit-tests
        run: python -m unittest discover -s tests -v
      - name: Openbare fictieve output genereren
        run: |
          mkdir -p dist
          python demo/generate.py --input demo/voorbeeldcontext.json > dist/fictieve-userstories.md
          python demo/generate.py --input demo/voorbeeldcontext.json --format json > dist/fictieve-userstories.json
      - name: Demoresultaten als downloadbaar artifact
        uses: actions/upload-artifact@v4
        with:
          name: fictieve-userstories-demo
          path: dist/
          retention-days: 14
